<form id="hastakayitFormu">
  <div class="mb-3">
    <label for="hastaTC" class="form-label">TC</label>
    <input type="text" class="form-control" id="hastaTC" name="hastaTC" minlength="11" maxlength="11" inputmode="numeric" pattern="[0-9]{11}" required>
  </div>
  <div class="mb-3">
    <label for="hastaAd" class="form-label">Ad</label>
    <input type="text" class="form-control" id="hastaAd" name="hastaAd" required>
  </div>
  <div class="mb-3">
    <label for="hastaSoyad" class="form-label">Soyad</label>
    <input type="text" class="form-control" id="hastaSoyad" name="hastaSoyad" required>
  </div>
  <div class="mb-3">
    <label for="hastaEposta" class="form-label">Email</label>
    <input type="email" class="form-control" id="hastaEposta" name="hastaEposta" required>
  </div>
  <div class="mb-3">
    <label for="hastaTlfn" class="form-label">Telefon Numarası</label>
    <input type="tel" class="form-control" id="hastaTlfn" name="hastaTlfn" placeholder="05xx xxx xx xx" required>
  </div>
  <div class="mb-3">
    <label for="hastaCinsiyet" class="form-label">Cinsiyetiniz</label>
    <select class="form-select" id="hastaCinsiyet" name="hastaCinsiyet" required>
      <option value="" selected disabled>Seçiniz</option>
      <option value="K">Kadın</option> 
      <option value="E">Erkek</option> 
    </select>
  </div>
  <div class="mb-3">
    <label for="hastaDgmTarih" class="form-label">Doğum Tarihi</label>
    <input type="date" class="form-control" id="hastaDgmTarih" name="hastaDgmTarih" required>
  </div>

  <div class="row mb-3">
    <div class="col-md-4 mb-3 mb-md-0">
      <label for="hastaAdresUlke" class="form-label">Ülke</label>
      <select class="form-select" id="hastaAdresUlke" name="hastaAdresUlke" required>
        <option value="" disabled selected>Ülke Seçiniz</option>
        <option value="Türkiye">Türkiye</option>
      </select>
    </div>
    <div class="col-md-4 mb-3 mb-md-0">
      <label for="hastaAdresil" class="form-label">İl</label>
      <select class="form-select" id="hastaAdresil" name="hastaAdresil" required>
        <option value="" disabled selected>İl Seçiniz</option>
        <option value="Kocaeli">Kocaeli</option>
        <option value="İstanbul">İstanbul</option>
        <option value="Sakarya">Sakarya</option>
        <option value="Eskişehir">Eskişehir</option>
        <option value="Ankara">Ankara</option>
        <option value="Bursa">Bursa</option>
      </select>
    </div>
    <div class="col-md-4">
      <label for="hastaAdresilce" class="form-label">İlçe</label>
      <select class="form-select" id="hastaAdresilce" name="hastaAdresilce" required disabled>
        <option value="" disabled selected>Önce il seçiniz</option>
      </select>
    </div>
  </div>

  <div class="mb-3">
    <label for="hastaAdres" class="form-label">Açık Adres</label>
    <textarea class="form-control" id="hastaAdres" name="hastaAdres" rows="2" placeholder="Mahalle, cadde, sokak..." required></textarea>
  </div>
  
  <button type="submit" class="btn btn-primary">Kayıt Ol</button>
</form>

<script>
const aktifMemurID = sessionStorage.getItem('aktifMemurID');
const personelTuruID = sessionStorage.getItem('personelTuruID');

if (!aktifMemurID || String(personelTuruID) !== '3') {
    sessionStorage.removeItem('aktifMemurID');
    sessionStorage.removeItem('personelTuruID');
    sessionStorage.removeItem('personelRol');
    alert('Memur oturumu bulunamadı. Lütfen tekrar giriş yapın.');
    window.location.href = 'memurGirisiSifre.html';
}

const ilceler = {
    Kocaeli: ['Darıca', 'Gebze', 'İzmit', 'Körfez', 'Gölcük'],
    İstanbul: ['Kadıköy', 'Üsküdar', 'Beşiktaş', 'Fatih', 'Bakırköy'],
    Sakarya: ['Adapazarı', 'Serdivan', 'Erenler', 'Akyazı', 'Sapanca'],
    Eskişehir: ['Odunpazarı', 'Tepebaşı', 'Sivrihisar', 'Çifteler'],
    Ankara: ['Çankaya', 'Keçiören', 'Mamak', 'Yenimahalle', 'Etimesgut'],
    Bursa: ['Osmangazi', 'Nilüfer', 'Yıldırım', 'Mudanya', 'İnegöl']
};

const ilSelect = document.getElementById('hastaAdresil');
const ilceSelect = document.getElementById('hastaAdresilce');

ilSelect.addEventListener('change', function() {
    const secilenIlceler = ilceler[this.value] || [];
    ilceSelect.innerHTML = '<option value="" disabled selected>İlçe Seçiniz</option>';

    secilenIlceler.forEach(function(ilce) {
        const option = document.createElement('option');
        option.value = ilce;
        option.textContent = ilce;
        ilceSelect.appendChild(option);
    });

    ilceSelect.disabled = secilenIlceler.length === 0;
});

document.getElementById('hastakayitFormu').addEventListener('submit', async function(e) {
    e.preventDefault(); 

    const formData = new FormData(this);
    const formProps = Object.fromEntries(formData);

    // SQL tablonuz varchar(10) olduğu için numaranın başında 0 varsa temizliyoruz (Örn: 0552 -> 552)
    if (formProps.hastaTlfn.startsWith('0')) {
        formProps.hastaTlfn = formProps.hastaTlfn.substring(1);
    }

    try {
        // İsteği memur için ayırdığımız özel endpoint'e gönderiyoruz.
        const response = await fetch('http://localhost:5000/api/memur/hasta-kayit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formProps) 
        });

        const result = await response.json();

        if (response.ok) {
            alert('Kayıt başarıyla tamamlandı! Şifreniz TC numaranızın son 6 hanesidir.');
            
            this.reset();
            ilceSelect.innerHTML = '<option value="" disabled selected>Önce il seçiniz</option>';
            ilceSelect.disabled = true;
        } else {
            alert('Hata: ' + result.message);
        }
    } catch (error) {
        console.error('Hata:', error);
        alert('Sunucuyla bağlantı kurulamadı.');
    }
});
</script>
